name: Factory Spec Validation

on:
  pull_request:
    paths:
      - 'project-spec.yaml'
      - 'factory/**'
      - 'policy/**'
      - 'distribution/**'
      - 'scripts/validate-project-spec.py'
      - 'scripts/factory-gate.py'
  push:
    branches: [main]
    paths:
      - 'project-spec.yaml'
      - 'factory/**'
      - 'policy/**'
      - 'distribution/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install 'pyyaml>=6,<7' 'jsonschema>=4,<5'
      - name: Validate product specification
        run: python scripts/validate-project-spec.py
      - name: Run factory CI gate
        run: python scripts/factory-gate.py --stage ci
