name: Publish Google Play Production

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name
        required: true
      version_code:
        description: Monotonic integer version code
        required: true
      rollout_fraction:
        description: Staged rollout fraction (example 0.10)
        required: true
        default: '0.10'

permissions:
  contents: read

jobs:
  publish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play-production
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ vars.ADMOB_BANNER_AD_UNIT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install factory validator dependencies
        run: pip install 'pyyaml>=6,<7' 'jsonschema>=4,<5'
      - name: Validate rollout fraction
        shell: bash
        run: |
          python - <<'PY'
          value = float('${{ inputs.rollout_fraction }}')
          if not 0.0 < value < 1.0:
              raise SystemExit('rollout_fraction must be > 0 and < 1')
          print(f'Production staged rollout: {value:.0%}')
          PY
      - name: Factory production gate
        run: python scripts/factory-gate.py --stage production
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Recreate signing keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build production AAB
        env:
          ORG_GRADLE_PROJECT_releaseKeystorePath: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseKeystorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_admobAppId: ${{ vars.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_admobBannerAdUnitId: ${{ vars.ADMOB_BANNER_AD_UNIT_ID }}
          ORG_GRADLE_PROJECT_versionName: ${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_versionCode: ${{ inputs.version_code }}
        run: gradle testReleaseUnitTest lintRelease bundleRelease --stacktrace
      - name: Upload staged production rollout
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APPLICATION_ID }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: production
          status: inProgress
          userFraction: ${{ inputs.rollout_fraction }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
