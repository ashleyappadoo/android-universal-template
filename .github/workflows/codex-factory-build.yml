name: Codex Factory Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scope for the coding agent
        required: true
        default: next_phase
        type: choice
        options:
          - next_phase
          - full_app

permissions:
  contents: write
  pull-requests: write

jobs:
  build-with-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require trusted main branch dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Run this workflow from main so Codex starts from the trusted source of truth."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install factory validator dependencies
        run: pip install 'pyyaml>=6,<7' 'jsonschema>=4,<5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preflight specification
        run: python scripts/validate-project-spec.py
      - name: Build application with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          effort: high
          prompt: |
            You are the Developer Agent for this Android AI Factory.
            Read AGENTS.md, PRODUCT_BRIEF.md, project-spec.yaml, factory/acceptance-criteria.yaml, PLANS.md, docs/FACTORY.md and the android-factory skill.
            Workflow mode: ${{ inputs.mode }}.
            If mode is next_phase, implement only the next incomplete implementation phase from PLANS.md.
            If mode is full_app, continue through as many implementation phases as can be completed with deterministic evidence, but stop before any human legal/policy/production approval gate.
            Keep scope grounded in the brief/spec. Do not invent product behavior for material ambiguities.
            Add tests, run the repository gates, repair failures, update acceptance evidence from observed results, and update PLANS.md/factory/state.yaml for verified milestones.
            Do not commit, push, publish, access production credentials, or change GitHub workflow security controls. Leave all code changes in the workspace for the workflow to verify and open as a PR.
      - name: Verify factory contract after Codex
        run: python scripts/factory-gate.py --stage ci
      - name: Verify Android build after Codex
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open implementation pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/factory-${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "feat: implement Android factory phase via Codex"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Codex factory implementation (${{ inputs.mode }})" --body "Automated implementation generated from PRODUCT_BRIEF.md and project-spec.yaml. Deterministic CI gates ran before this PR was opened. Review acceptance evidence, UX and policy impacts before merge."
      - name: No changes required
        if: steps.changes.outputs.changed != 'true'
        run: echo "Codex produced no repository changes."
